[project]
name = "pix-compliance-swarm"
version = "0.1.0"
description = "Enxame de agentes Pydantic AI para compliance de normativos PIX fictícios do BCB"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "reportlab>=4.0",
    "boto3>=1.34",
    "botocore>=1.34",
    "pydantic-ai-slim[bedrock,mcp]>=0.0.1",
    "anthropic[bedrock]>=0.40",
    "tenacity>=8.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # Fixado (não >=) porque a série 2.x do SDK mcp reestruturou o pacote
    # (FastMCP mudou de módulo) de forma incompatível com a API usada aqui.
    "mcp==1.29.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "fixtures", "mcp_servers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
